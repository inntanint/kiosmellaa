<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kios Mellaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div  id="screen-home">
    <section class="home-hero">
      <div class="ring"><img src="images/profil.jpeg" alt="Kios Mellaa"></div>
      <div class="kicker">Hay Day Store</div>
      <h1>Kios Mellaa</h1>
      <p>Pilih Kategori Di Bawah Untuk Mulai Belanja</p>
    </section>

    <div class="menu-wrap">
      <button class="menu-card food" onclick="location.href='food.html'">
        <div class="icon">🍞</div>
        <div class="info">
          <div class="title">Food &amp; Item Lainnya</div>
          <div class="desc">Food, Perhiasan dan Lainnya</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card voucher" onclick="location.href='voucher.html'">
        <div class="icon">🎟️</div>
        <div class="info">
          <div class="title">Voucher Warna Warni</div>
          <div class="desc">Voucher Via Login</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card altam" onclick="location.href='altam.html'">
        <div class="icon">⛏️</div>
        <div class="info">
          <div class="title">Altam &amp; Albeg</div>
          <div class="desc">Alat Tambang dan Alat Begal</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card badas" onclick="location.href='badas.html'">
        <div class="icon">🥛</div>
        <div class="info">
          <div class="title">Badas</div>
          <div class="desc">Bahan Dasar</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card diamond" onclick="location.href='diamond.html'">
        <div class="icon">💎</div>
        <div class="info">
          <div class="title">Diamond</div>
          <div class="desc">Top Up Diamond Hay Day Via Login</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card koin" onclick="location.href='koin.html'">
        <div class="icon">🪙</div>
        <div class="info">
          <div class="title">Koin</div>
          <div class="desc">Top Up Koin Hay Day</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card alatup" onclick="location.href='alatup.html'">
        <div class="icon">🛠️</div>
        <div class="info">
          <div class="title">Alat Up (Bem, Sem, Lem)</div>
          <div class="desc">Perlengkapan Upgrade</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card akun" onclick="location.href='akun.html'">
        <div class="icon">👤</div>
        <div class="info">
          <div class="title">Akun</div>
          <div class="desc">Akun Player dan Akun Gudang</div>
        </div>
        <div class="arrow">›</div>
      </button>
    </div>

    <p class="footer-note">👒Happy Shopping👒</p>
  </div>

</body>
</html>
